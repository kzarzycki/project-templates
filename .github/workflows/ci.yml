name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job names its own permissions (ghalint's job_permissions policy).
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # ~2x the slowest recent successful run (8.6 min), rounded up: a hung job stops here, not at GitHub's 6 hours.
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - name: Install root test tools
        run: uv tool install copier==9.17.0 && uv tool install pre-commit==4.6.0
      - name: Select the root tests this change touches
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A PR diffs against its base, a push to main against the previous tip.
          # A nightly or manual run has no base, so the selector picks every module.
          base=""
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          [ "$EVENT" = push ] && base="$PUSH_BEFORE"
          modules=$(python3 scripts/affected_tests.py "$base" | tr '\n' ' ')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Running: $modules"
      - name: Run root unittest suite
        env:
          MODULES: ${{ steps.select.outputs.modules }}
        # MODULES is the selector's own output, a list of tests.<name> words
        run: >-
          mise exec github:microsoft/apm@0.33.0 --
          uv run --with PyYAML==6.0.3 --
          python3 -m unittest $MODULES
      - name: Check the root workflows against ghalint's policies
        run: mise exec aqua:suzuki-shunsuke/ghalint@1.6.0 -- ghalint run
      - name: Install example tools
        working-directory: examples/agent-layer-mvp
        run: mise install
      - name: Check example coding-agent contract
        working-directory: examples/agent-layer-mvp
        run: mise run agent-sync -- --frozen
      - name: Run example behavioral tests
        working-directory: examples/agent-layer-mvp
        run: mise run test
      - name: Lint example
        working-directory: examples/agent-layer-mvp
        run: mise run lint

  generate:
    # apple/xcode's check:all runs its gate script (swift test), which needs Xcode: macOS.
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    # ~2x the slowest recent successful run (1.4 min), rounded up.
    timeout-minutes: 3
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { type: software/python }
          - { type: software/node }
          - { type: software/java }
          - { type: data/dbt }
          - { type: authoring/content }
          - { type: ai/skills }
          - { type: ai/mcp, language: python }
          - { type: ai/mcp, language: node }
          - { type: infra/terraform }
          - { type: apple/xcode, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The java leaf runs spotless (google-java-format) in its pre-commit hook at
      # scaffold time, which needs a JDK matching the template's default java_version.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - name: Install copier + pre-commit
        run: uv tool install copier==9.17.0 && uv tool install pre-commit==4.6.0
      - name: Generate a ${{ matrix.type }} project from the local checkout
        env:
          BOOTSTRAP_TEMPLATE_SRC: ${{ github.workspace }}
          PROJECT_TYPE: ${{ matrix.type }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          args=(--name ci-proj --type "$PROJECT_TYPE" --dest _out/ci-proj)
          [ -n "$LANGUAGE" ] && args+=(--language "$LANGUAGE")
          args+=(include_agent_layer=true include_engineering_workflow=true include_fnox=true)
          args+=(loop=true)
          if [ "$PROJECT_TYPE" = "infra/terraform" ]; then
            mise exec terraform@1.15.8 tflint@0.63.1 -- \
              skills/bootstrap-project/scripts/bootstrap.sh "${args[@]}"
          else
            skills/bootstrap-project/scripts/bootstrap.sh "${args[@]}"
          fi
      - name: Assert one clean commit with the trailer
        working-directory: _out/ci-proj
        run: |
          test "$(git rev-list --all --count)" = "1"
          test -z "$(git status -s)"
          git log -1 --format='%b' | grep -q 'Co-Authored-By: Claude'
          test -f apm.yml
          test -f fnox.toml
          test -f .apm/instructions/project.instructions.md
          test ! -e .agents-toolkit
          test ! -e scripts/agent-layer
          grep -q 'git: kzarzycki/agent-skills/engineering' apm.yml
          grep -q '^\[tasks."agent:sync"\]$' mise.toml
          grep -q '^\[tasks."agent:claude"\]$' mise.toml
          grep -q '^\[tasks."agent:codex"\]$' mise.toml
          grep -q '^\[tasks.check\]$' mise.toml
          grep -q 'run: mise run ci:parts' .github/workflows/ci.yml
          grep -q '^\[tasks."loop:approvals"\]$' .mise/conf.d/loop.toml
          grep -q '^\[tasks."loop:land"\]$' .mise/conf.d/loop.toml
          ! grep -q 'loop:' mise.toml
          grep -q 'run: mise run ci:approvals' .github/workflows/approvals.yml
          grep -q '^\[tasks."setup:github"\]$' .mise/conf.d/loop.toml
          # merge_queue defaults to false: no workflow listens to a queue
          ! grep -rq 'merge_group' .github/workflows/
          ! grep -q '"merge_queue"' .github/rulesets/main.json
          test ! -e .github/workflows/gate.yml
          grep -Eq '^ *(- )?(repo: [^l]|rev:)' .pre-commit-config.yaml && exit 1
          python3 -m json.tool .github/rulesets/main.json >/dev/null
          test -f docs/agents/loop.md
          test -f docs/agents/issue-tracker.md
          test -f docs/agents/coding-standards.md
          grep -q 'engineering-loop' .apm/instructions/loop.instructions.md
          test -f .github/workflows/loop-ci.yml
          grep -q 'loop-check' .github/rulesets/main.json
      - name: Run every check the generated CI runs
        working-directory: _out/ci-proj
        run: mise run check:all
      - name: List the generated CI's parts
        working-directory: _out/ci-proj
        run: mise run ci:parts

  nightly-red:
    # A scheduled or manual run that fails opens one nightly-red issue, or comments on the open one.
    needs: [verify, generate]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    # A few API calls; no recent run to measure, since it runs only after a red scheduled run.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The full suite is red at ${SHA}. Run: ${RUN_URL}"
          gh label create nightly-red --color B60205 --description "The nightly full run failed" 2>/dev/null || true
          open=$(gh issue list --label nightly-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label nightly-red --title "Nightly full run is red at ${SHA:0:7}" --body "$body"
          fi
