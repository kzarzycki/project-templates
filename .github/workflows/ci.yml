name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { type: software/python }
          - { type: software/node }
          - { type: software/java }
          - { type: data/dbt }
          - { type: authoring/content }
          - { type: ai/skills }
          - { type: ai/mcp, language: python }
          - { type: infra/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The java leaf runs spotless (google-java-format) in its pre-commit hook at
      # scaffold time, which needs a JDK matching the template's default java_version.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: false
      - name: Install copier + pre-commit
        run: uv tool install copier && uv tool install pre-commit
      - name: Generate a ${{ matrix.type }} project from the local checkout
        env:
          BOOTSTRAP_TEMPLATE_SRC: ${{ github.workspace }}
          PROJECT_TYPE: ${{ matrix.type }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          args=(--name ci-proj --type "$PROJECT_TYPE" --dest _out/ci-proj)
          [ -n "$LANGUAGE" ] && args+=(--language "$LANGUAGE")
          args+=(include_agent_layer=true include_fnox=true)
          if [ "$PROJECT_TYPE" = "infra/terraform" ]; then
            mise exec terraform@1.13.5 tflint@latest -- \
              skills/bootstrap-project/scripts/bootstrap.sh "${args[@]}"
          else
            skills/bootstrap-project/scripts/bootstrap.sh "${args[@]}"
          fi
      - name: Assert one clean commit with the trailer
        working-directory: _out/ci-proj
        run: |
          test "$(git rev-list --all --count)" = "1"
          test -z "$(git status -s)"
          git log -1 --format='%b' | grep -q 'Co-Authored-By: Claude'
          test -f apm.yml
          test -f fnox.toml
          test -f .apm/instructions/project.instructions.md
          test ! -e .agents-toolkit
          test ! -e scripts/agent-layer
          grep -q '^\[tasks.agent-sync\]$' mise.toml
          grep -q '^\[tasks.agent-check\]$' mise.toml
          grep -q '^\[tasks.agent-claude\]$' mise.toml
          grep -q '^\[tasks.agent-codex\]$' mise.toml
