name: CI
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Example-specific coding-agent acceptance commands use mise explicitly in
      # this non-interactive CI shell. Activated local shells can call tools directly.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git — remove it and add it to .gitignore" >&2
            exit 1
          fi
      - name: pre-commit
        run: mise exec -- pre-commit run --all-files --show-diff-on-failure
      - run: mise exec -- uv sync --locked
      - run: mise run agent-sync -- --frozen
      - run: mise exec -- uv run pytest --cov --cov-report=xml
      # Diff coverage gates PRs only. On a push to main, github.base_ref is empty
      # and origin/main == HEAD, so the diff would be empty and the gate a no-op —
      # gate the PR, where the base branch is a real, different ref.
      - name: Diff coverage
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: mise exec -- uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=100
