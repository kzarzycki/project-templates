[project]
name = "agent-layer-mvp"
version = "0.1.0"
description = "Example of one project-owned coding agent configuration compiled for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "CI", email = "ci@example.com" }]
dependencies = [
  # Demonstration MCP dependency for the canary server; the template does not add it.
  "mcp>=1.28,<2",
]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-cov>=7.1", "diff-cover>=10.3", "ruff>=0.15.22"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
