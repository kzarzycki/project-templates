[tools]
python = "3.14"
uv = "latest"
pre-commit = "latest"
"github:microsoft/apm" = "0.23.1"
fnox = "1.30.0"


[tasks.agent-sync]
description = "Install locked APM dependencies and compile Claude Code and Codex configuration."
run = """
command -v apm >/dev/null || { echo "error: apm 0.23.1 is required; run 'mise install'" >&2; exit 127; }
if [ -f apm.lock.yaml ]; then
  apm install --frozen --target claude,codex
else
  apm install --target claude,codex
fi
apm compile --target claude,codex
"""

[tasks.agent-check]
description = "Validate APM sources, generated files, and fnox declarations."
run = """
command -v apm >/dev/null || { echo "error: apm 0.23.1 is required; run 'mise install'" >&2; exit 127; }
command -v python3 >/dev/null || { echo "error: python3 is required; run 'mise install'" >&2; exit 127; }
command -v fnox >/dev/null || { echo "error: fnox 1.30.0 is required; run 'mise install'" >&2; exit 127; }
apm compile --validate --target claude,codex
apm audit --ci --no-policy
if [ -f .mcp.json ]; then python3 -m json.tool .mcp.json >/dev/null; fi
if [ -f .codex/config.toml ]; then python3 -c 'import tomllib; tomllib.load(open(".codex/config.toml", "rb"))'; fi
fnox check --profile local --no-defaults --all --non-interactive --if-missing error
"""

[tasks.agent-claude]
description = "Launch Claude Code with this repository's machine bindings."
run = """
command -v fnox >/dev/null || { echo "error: fnox 1.30.0 is required; run 'mise install'" >&2; exit 127; }
command -v claude >/dev/null || { echo "error: claude is required; install Claude Code and add 'claude' to PATH" >&2; exit 127; }
fnox exec --profile local --no-defaults --non-interactive --if-missing error -- claude
"""

[tasks.agent-codex]
description = "Launch Codex with this repository's machine bindings."
run = """
command -v fnox >/dev/null || { echo "error: fnox 1.30.0 is required; run 'mise install'" >&2; exit 127; }
command -v codex >/dev/null || { echo "error: codex is required; install Codex and add 'codex' to PATH" >&2; exit 127; }
fnox exec --profile local --no-defaults --non-interactive --if-missing error -- codex
"""


[tasks.test]
run = "uv run pytest"

[tasks.lint]
run = "uv run ruff check ."

[tasks.fmt]
run = "uv run ruff format ."

[tasks.bootstrap]
run = "uv sync && pre-commit install --install-hooks"

[hooks]
postinstall = "pre-commit install --install-hooks"
